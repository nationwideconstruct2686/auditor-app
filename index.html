/* Layout: one calm column, the current question large in the middle, controls at the thumb. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --fg: #1f2b2e; --muted: #5d6d70;

}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141d20; --surface: #1d2a2e; --fg: #e6eeec; --muted: #9db0ae;
    --accent: #6fb7ae; --accent-fg: #0f1a1c; --line: #2c3c40; --warn: #e39a7b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 20px; gap: 18px; }
h1 { font: 600 30px/1.15 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 20px/1.2 var(--display); margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
button, input, textarea { font: inherit; }
button { border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; background: var(--accent); color: var(--accent-fg); font-weight: 700; }
button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
label { font-weight: 700; font-size: 14px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 2px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 16px; }
.mode b { font: 600 19px/1.25 var(--display); }
.mode span { color: var(--muted); font-weight: 400; font-size: 15px; }
.mode .soon { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mode:disabled { opacity: .6; }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; min-height: 40vh; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.status[data-s="listening"] .dot { background: var(--accent); animation: pulse 1.2s infinite; }
.status[data-s="speaking"] .dot { background: var(--muted); }
.status[data-s="thinking"] .dot { background: var(--muted); animation: pulse .6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.question { font: 400 28px/1.3 var(--display); text-wrap: balance; }
.heard { min-height: 1.5em; color: var(--muted); font-size: 18px; }
.counter { font: 600 64px/1 var(--display); font-variant-numeric: tabular-nums; }
.counter small { font-size: 24px; color: var(--muted); }
.mic { width: 84px; height: 84px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.mic svg { width: 34px; height: 34px; }
.mic.off { background: transparent; color: var(--warn); border: 2px solid var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
textarea.report { width: 100%; min-height: 60vh; resize: vertical; color: var(--fg); font-size: 16px; } /* 16px stops iPhone zooming in */
.report { white-space: pre-wrap; font-size: 15px; word-break: break-word; overflow-wrap: anywhere; }
.list button { width: 100%; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); font-weight: 400; }
.err { color: var(--warn); }
.truth p { margin: 0; font-size: 17px; line-height: 1.55; }
.reqs { margin: 0; padding-left: 36px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
</style>

// iPhone only lets a page talk after a tap, so this runs inside the tap that starts a session.

async function say(text) {

class Stopped extends Error {}
// Previous question: the session is rebuilt by silently replaying everything logged before that question,

// What a skipped question's answer reads as in the notes.
const SKIPPED = T("(skipped)");

// Waits for one answer: spoken, typed, or (for the cancel step) a timeout.

// ---------------------------------------------------------------- AI (light touch)
async function ai(task, payload, timeoutMs) {
  if (!session?.aiOn) return null; // switched off: the scripted fallbacks take over
  if (replaying()) { const v = replayNext("ai"); if (v !== MISS) return v; }
  return record("ai", await callAi(task, payload, timeoutMs));
}
async function callAi(task, payload, timeoutMs) {
  try {
    const call = sb.functions.invoke("auditor-ai", { body: { task, payload } });
    const res = await (timeoutMs ? Promise.race([call, new Promise(r => setTimeout(() => r(null), timeoutMs))]) : call);
    if (!res || res.error || !res.data) return null;
    if (res.data.usage) { session.usage.input += res.data.usage.input; session.usage.output += res.data.usage.output; session.usage.calls++; }
    return res.data.result;
  } catch { return null; }
}

// ---------------------------------------------------------------- the procedure
// What the AI needs to answer a question the person asks mid-session.
const qaPayload = (line, answer) => ({ question: line, answer, mode: modeTitle(session.mode), concepts: [DEFINITIONS, ...TRUTH], lang: LANG });
const MAX_QUESTIONS = 3; // per app question, so a misheard answer can't loop forever

// Asks one question and returns the answer. If the person asks the app something instead of answering,
// the AI answers it fully, then the same question is asked again before moving on.
// lead: spoken before the question. questions: false where the answer itself may sound like a question
// (a counter-intention like "why me?").
async function ask(line, { reflect = false, questions = true, lead = "", skip = true } = {}) {
  let spoken = [session.ack, lead, line].filter(Boolean).join(" ");
  session.ack = "";
  for (let asked = 0; ; asked++) {
    await say(spoken);
    ui.question(line);
    session.asking = line;
    session.noSkip = !skip; ui.skipEnabled(skip);
    const answer = await getAnswer();
    session.noSkip = false; ui.skipEnabled(true);
    session.transcript.push({ q: line, a: answer });
    if (answer === SKIPPED) return answer;
    if (isStop(answer)) throw new Stopped();
    if (isDistress(answer)) throw new Distress();
    if (!answer || !session.aiOn) return answer;
    const canAnswer = questions && asked < MAX_QUESTIONS;
    // Steps with an echo-back check every answer; other steps only check ones that look like a question.
    const task = reflect ? "reflect" : canAnswer && looksLikeQuestion(answer) ? "answer" : null;
    if (!task) return answer;
    ui.status("thinking");
    const r = await ai(task, qaPayload(line, answer), 12000);
    if (r && r.distress) throw new Distress();
    if (canAnswer && r && r.is_question && typeof r.reply === "string" && r.reply) {
      session.transcript.push({ q: "(answer to their question)", a: r.reply });
      spoken = `${r.reply.slice(0, 600)} ${S.CONTINUE} ${line}`;
      continue;
    }
    // Complete the communication cycle: a reply that didn't answer the question gets "I understand" and the question again.
    if (canAnswer && reflect && r && r.answered === false) {
      session.transcript.push({ q: "(didn't answer the question)", a: answer });
      spoken = `${S.UNDERSTAND} ${line}`;
      continue;
    }
    if (reflect && r && typeof r.ack === "string") session.ack = r.ack.slice(0, 120);
    return answer;
  }
}

// Asks until it gets a number or a yes/no. A question from the person gets answered, then the same
// question is asked again; it doesn't count as one of the three tries.
// skipValue: what Skip counts as; without one the question can't be skipped.
async function askParsed(line, parse, kind, skipValue) {
  let lead = "", questions = 0;
  for (let tries = 0; tries < 3; tries++) {
    const answer = await ask(line, { lead, skip: skipValue !== undefined });
    if (answer === SKIPPED) return skipValue;
    lead = "";
    let v = parse(answer), offTopic = false;
    if (v === null && answer && session.aiOn) {
      ui.status("thinking");
      const r = await ai("classify", { ...qaPayload(line, answer), kind }, 12000);
      if (r && r.distress) throw new Distress();
      if (r && r.is_question && typeof r.reply === "string" && r.reply && questions++ < MAX_QUESTIONS) {
        session.transcript.push({ q: "(answer to their question)", a: r.reply });
        lead = `${r.reply.slice(0, 600)} ${S.CONTINUE}`;
        tries--;
        continue;
      }
      if (r && r.value !== null && r.value !== undefined) v = kind === "number" ? Math.max(0, Math.min(10, Math.round(+r.value))) : !!r.value;
      if (Number.isNaN(v)) v = null;
      offTopic = v === null && r && r.answered === false;
    }
    if (v !== null) return v;
    if (offTopic && questions++ < MAX_QUESTIONS) { lead = S.UNDERSTAND; tries--; continue; } // didn't answer: doesn't use up a try
    lead = S.REPEAT_Q;

async function repeatTen(intro, phrase) {
  await say(intro + phrase);
  ui.question(T("Say it ten times:\n“{0}”", phrase));
  return countTen(phrase);
}

async function runItem() {
  const item = { name: null, location: null, start: null, cycles: [] };
  session.items.push(item);
  if (session.mode.name_q) item.name = cleanPhrase(await ask(session.mode.name_q, { reflect: true }));
  item.location = await ask(S.LOCATE, { reflect: true });
  item.start = await askParsed(S.INTENSITY, parseNumber, "number");
  for (let c = 0; c < MAX_CYCLES; c++) {
    const cyc = { perceptics: {}, counter: null, negCount: 0, seed: null, posCount: 0, after: null };
    item.cycles.push(cyc);
    for (const [key, line] of S.PERCEPTICS) cyc.perceptics[key] = await ask(line, { reflect: true });
    for (const key of await pickExtras(item, cyc)) cyc.perceptics[key] = await ask(EXTRA[key], { reflect: true });
    for (const [key, line] of S.PERSONIFY) cyc.perceptics[key] = await ask(line, { reflect: true });
    await say(S.CONTACT);
    session.transcript.push({ q: S.CONTACT, a: await getAnswer({ autoContinueMs: 15000 }) });
    if (session.mode.memory && await askParsed(MEM.ANY, parseYesNo, "yesno")) {
      cyc.memory = { name: null, situation: null, start: null, passes: [] };
      await processMemory(cyc.memory);
      await say(MEM.BACK);
    }
    await neutralize(cyc);
    cyc.after = await askParsed(S.CHECK, parseNumber, "number");
    saveProgress();
    if (cyc.after === 0) return;
    await say(S.AGAIN);
  }
}

// Deep processing: keep having the person describe it until it's there right now.
async function drawUp(draw) {
  if (!draw) return false;
  for (let i = 0; i < MAX_DRAWS; i++) {
    session.drawn.push(await ask(i ? draw.MORE : draw.DESCRIBE, { reflect: true }));
    saveProgress();
    if (await askParsed(draw.HAVE, parseYesNo, "yesno")) return true;
  }
  return false;
}

// Takes one memory through until it has no charge left. Fills in mem as it goes so progress saves.
async function processMemory(mem) {
  mem.name = cleanPhrase(await ask(MEM.WHAT, { reflect: true }));
  mem.situation = await ask(MEM.SITUATION, { reflect: true });
  mem.start = await askParsed(MEM.CHARGE, parseNumber, "number");
  if (mem.start === 0) return;
  for (let p = 0; p < MAX_PASSES; p++) {
    const pass = { perceptics: {}, story: null, counter: null, negCount: 0, seed: null, posCount: 0, after: null };
    mem.passes.push(pass);
    const line = p ? MEM.AGAIN : MEM.BEGIN;
    await say(line);
    session.transcript.push({ q: line, a: await getAnswer({ autoContinueMs: 10000 }) });
    for (const [key, q] of MEM.PERCEPTICS) pass.perceptics[key] = await ask(q, { reflect: true });
    pass.story = await ask(MEM.THROUGH, { reflect: true });
    if (session.mode.item === "memory") await neutralize(pass);
    pass.after = await askParsed(MEM.CHECK, parseNumber, "number");
    saveProgress();
    if (pass.after === 0) return;
  }
}

// One experience: percepts, the limiting thought, cancel, the replacement, until nothing about it is suboptimal.
// Each thought is stored as an item with one cycle, so the report lists what was canceled and planted.
async function runThoughts() {
  await say(THOUGHT.THINK);
  session.transcript.push({ q: THOUGHT.THINK, a: await getAnswer({ autoContinueMs: 10000 }) });
  for (let n = 0; n < MAX_CYCLES; n++) {
    const cyc = { perceptics: {}, counter: null, negCount: 0, seed: null, posCount: 0, after: null };
    const item = { name: null, cycles: [cyc] };
    session.items.push(item);
    item.name = cyc.counter = cleanPhrase(await ask(n ? THOUGHT.VOICE : THOUGHT.WHAT, { questions: false, skip: false }));
    if (n) await say(THOUGHT.THANKS);
    cyc.negCount = await repeatTen(THOUGHT.REPEAT_NEG, cyc.counter);
    await say(THOUGHT.CANCEL);
    await getAnswer({ autoContinueMs: 7000 });
    cyc.seed = cleanPhrase(await ask(n ? THOUGHT.REPLACE : THOUGHT.REPLACE_FIRST, { questions: false, skip: false }));
    cyc.posCount = await repeatTen(THOUGHT.REPEAT_POS, cyc.seed);
    cyc.after = 0;
    saveProgress();
    if (!(await askParsed(THOUGHT.ANOTHER, parseYesNo, "yesno"))) break;
  }
  await say(THOUGHT.THANKS);
}

async function runExperienceItem() {
  const item = { name: null, ideal: null, cycles: [] };
  session.items.push(item);
  item.name = cleanPhrase(await ask(EXP.WHAT, { reflect: true }));
  item.ideal = await ask(EXP.IDEAL, { reflect: true });
  for (let c = 0; c < MAX_CYCLES; c++) {
    const cyc = { perceptics: {}, counter: null, negCount: 0, seed: null, posCount: 0, after: null };
    item.cycles.push(cyc);
    await say(c ? EXP.AGAIN : EXP.BEGIN);
    for (const [key, q] of EXP.PERCEPTICS) cyc.perceptics[key] = await ask(q, { reflect: true });
    await neutralize(cyc);
    cyc.after = (await askParsed(EXP.CHECK, parseYesNo, "yesno")) ? 1 : 0; // 0: nothing left that isn't optimal
    saveProgress();
    if (cyc.after === 0) return;
  }
}

async function runMemoryItem() {
  const mem = { name: null, situation: null, start: null, passes: [] };
  session.memories.push(mem);
  await processMemory(mem);
}

// Counter-intention 10x, cancel cancel, then the replacement 10x. Fills in counter/negCount/seed/posCount.
async function neutralize(rec) {
  rec.counter = cleanPhrase(await ask(S.VOICE, { questions: false, skip: false }));
  rec.negCount = await repeatTen(S.REPEAT_NEG, rec.counter);
  await say(S.CANCEL);
  await getAnswer({ autoContinueMs: 7000 });
  rec.seed = cleanPhrase(await ask(S.REPLACE, { questions: false, skip: false }));
  rec.posCount = await repeatTen(S.REPEAT_POS, rec.seed);
}

// Haiku picks which extra perceptics fit; if it can't answer, rotate through the ones not asked yet.
async function pickExtras(item, cyc) {
  const used = item.cycles.flatMap(c => Object.keys(c.perceptics)).filter(k => k in EXTRA);
  const fresh = Object.keys(EXTRA).filter(k => !used.includes(k));
  const pool = fresh.length >= EXTRAS_PER_CYCLE ? fresh : Object.keys(EXTRA);
  ui.status("thinking");
  const r = await ai("pick", {
    options: Object.fromEntries(pool.map(k => [k, EXTRA[k]])),
    described: { location: item.location, ...cyc.perceptics },
    count: EXTRAS_PER_CYCLE,
  }, 5000);
  const picked = (r && Array.isArray(r.keys) ? r.keys : []).filter(k => pool.includes(k));
  for (const k of pool) if (picked.length < EXTRAS_PER_CYCLE && !picked.includes(k)) picked.push(k);
  return [...new Set(picked)].slice(0, EXTRAS_PER_CYCLE);
}

// Returns true when the person is ready to start.
async function runChecklist() {
  ui.requirements(REQUIREMENTS);
  let reviewed = false, skipped = false;
  while (!reviewed) {
    const answer = await ask(S.REVIEW);
    skipped = answer === SKIPPED;
    reviewed = skipped || parseYesNo(answer) === true;
    if (!reviewed) await say(S.REVIEW_WAIT);
  }
  ui.requirements(null);
  const ready = skipped || await askParsed(S.READY, parseYesNo, "yesno", true);
  session.checklist.push({ key: "requirements reviewed", answer: "yes", ok: true });
  session.checklist.push({ key: "ready to begin", answer: ready ? "yes" : "no", ok: ready });
  if (!ready) { await say(S.NOT_READY); session.outcome = "not ready"; return false; }
  return true;
}

async function openSession() {
  session.opened = true;
  for (const line of S.OPENING) { await say(line); if (!replaying()) await wait(600); }
}
async function closeSession() {
  for (const line of S.CLOSING) { await say(line); await wait(700); }
}

async function runSession(mode) {
  Object.assign(S, S_BASE, mode.lines);
  micOff = false;
  session = { mode, id: null, started: new Date(), pending: null, replay: [], usage: { input: 0, output: 0, calls: 0 } };
  ui.sessionScreen();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  const { data: st } = await sb.from("auditor_settings").select("ai_enabled").eq("id", 1).maybeSingle();
  session.aiOn = st?.ai_enabled !== false;
  const { data } = await sb.from("auditor_sessions").insert({ mode: mode.id }).select("id").single();
  session.id = data?.id ?? null;
  for (;;) {
    // Fresh session data each run; after Previous question, the replay fills it back in up to that question.
    Object.assign(session, { items: [], memories: [], drawn: [], transcript: [], checklist: [], outcome: "completed",
                             ack: "", opened: false, asking: null, backRequested: false, log: [], pos: 0 });
    try {
      if (await runChecklist()) {
        await openSession();
        if (mode.item === "thought") await runThoughts();
        else if (!(await askParsed(S.START, parseYesNo, "yesno")) && !(await drawUp(mode.draw))) { session.outcome = "no charge present"; await say(S.NONE_START); }
        else {
          while (true) {
            await (mode.item === "memory" ? runMemoryItem() : mode.item === "experience" ? runExperienceItem() : runItem());
            if (!(await askParsed(S.ITEM_DONE, parseYesNo, "yesno"))) break;
          }
          await say(S.END);
        }
      }
    } catch (e) {
      if (e instanceof Rewind) { speechSynthesis.cancel(); ui.requirements(null); session.replay = e.replay; continue; }
      if (e instanceof Distress) session.outcome = "paused for safety";
      else if (e instanceof Stopped) { session.outcome = "stopped by user"; speechSynthesis.cancel(); }
      else { session.outcome = "ended by an error"; console.error(e); }
    }
    break;
  }
  // Whatever ended the session, count the person out of it before anything else.
  if (session.opened) { try { await closeSession(); } catch {} }
  if (session.outcome === "paused for safety") await say(S.DISTRESS);
  try { wakeLock?.release(); } catch {}
  ui.status("thinking"); ui.question(T("Saving your session..."));
  let summary = null;
  if (session.items.length || session.memories.length) summary = await ai("summary", { log: logData(), lang: LANG }, 20000);
  const report = buildReport(summary);
  await sb.from("auditor_sessions").update({ ended_at: new Date().toISOString(), outcome: session.outcome, log: logData(), report }).eq("id", session.id);
  const s = session; session = null;
  ui.reportScreen(report, s.outcome === "paused for safety", s.id);
}
let wakeLock = null;

function logData() {
  return { mode: session.mode.id, checklist: session.checklist, items: session.items, memories: session.memories, drawn: session.drawn, usage: session.usage, started: session.started.toISOString() };
}
async function saveProgress() {
  if (session?.id && !replaying()) sb.from("auditor_sessions").update({ log: logData() }).eq("id", session.id).then(() => {});
}

function buildReport(summary) {
  const fmt = d => d.toLocaleString(LOCALE, { dateStyle: "medium", timeStyle: "short" });
  const L = [T("{0} Session", modeTitle(session.mode)), `${fmt(session.started)}  ·  ${T(session.outcome)}`, ""];
  if (summary) L.push(summary, "");
  if (session.drawn.length) L.push(T("DRAWN UP"), ...session.drawn.map(d => `  ${d}`), "");
  if (session.checklist.length) {
    L.push(T("READINESS"));
    for (const c of session.checklist) L.push(`  ${c.ok ? "✓" : c.resolved ? "↻" : "✕"} ${T(c.key)}: ${T(c.answer)}${c.resolved ? T(" (taken care of)") : ""}`);
    L.push("");
  }
  session.items.forEach((it, i) => {
    const thought = session.mode.item === "thought";
    L.push(T("ITEM {0}: {1}", i + 1, [it.name, it.location].filter(Boolean).join(", ") || T("(not located)")));
    if (!thought) L.push(it.ideal != null ? T("Ideal outcome: {0}", it.ideal) : T("Starting intensity: {0}", it.start ?? "-"));
    it.cycles.forEach((c, j) => {
      if (!thought) L.push(`  ${T("Cycle {0}", j + 1)}`);
      for (const [k, v] of Object.entries(c.perceptics)) L.push(`    ${keyLabel(k)}: ${v}`);
      if (c.memory) L.push(...memoryLines(c.memory, "    "));
      if (c.counter) L.push(`    ${T("Counter-intention: \"{0}\" (said {1}x, canceled)", c.counter, c.negCount)}`);
      if (c.seed) L.push(`    ${T("Seed: \"{0}\" (said {1}x)", c.seed, c.posCount)}`);
      if (c.after !== null && !thought) L.push(`    ${it.ideal != null ? T("Optimal now: {0}", T(c.after === 0 ? "yes" : "no")) : T("Intensity after: {0}", c.after)}`);
    });
    L.push("");
  });
  session.memories.forEach((m, i) => L.push(...memoryLines(m, "", i + 1), ""));
  const memories = [...session.memories, ...session.items.flatMap(it => it.cycles.filter(c => c.memory).map(c => c.memory))];
  const memDone = memories.filter(m => m.start === 0 || (m.passes.length && last(m.passes).after === 0));
  const discharged = session.items.filter(it => it.cycles.length && last(it.cycles).after === 0);
  const recs = [...session.items.flatMap(it => it.cycles), ...memories.flatMap(m => m.passes)];
  const counters = recs.filter(c => c.counter && c.negCount).map(c => c.counter);
  const seeds = recs.filter(c => c.seed && c.posCount).map(c => c.seed);
  L.push(T("RESULT"));
  if (memories.length) L.push(T("Memories discharged: {0} of {1}.", memDone.length, memories.length));
  if (session.mode.item === "thought") L.push(T("{0} canceled: {1}.", session.mode.noun, session.items.filter(it => it.cycles[0].negCount).length));
  else if (session.mode.item === "experience") L.push(T("{0} optimized: {1} of {2}.", session.mode.noun, discharged.length, session.items.length));
  else if (session.mode.item !== "memory") L.push(session.items.length && discharged.length === session.items.length
    ? T("{0} discharged: {1} of {2}, all intensity zero.", session.mode.noun, discharged.length, session.items.length)
    : T("{0} discharged: {1} of {2}.", session.mode.noun, discharged.length, session.items.length));
  session.items.filter(it => !discharged.includes(it)).forEach(it =>
    L.push(`  ${it.ideal != null ? T("Still open: {0}", it.name) : T("Still open: {0} (last intensity {1})", it.name || it.location, it.cycles.length ? last(it.cycles).after : it.start)}`));
  L.push("", T("Counter-intentions erased (canceled):"), ...(counters.length ? counters.map(c => `  ✕ ${c}`) : [`  ${T("none")}`]));
  L.push("", T("Positive seeds planted:"), ...(seeds.length ? seeds.map(s => `  ✓ ${s}`) : [`  ${T("none")}`]));
  const u = session.usage, cost = u.input * PRICE_IN + u.output * PRICE_OUT;
  if (!session.aiOn) L.push("", T("AI use: switched off"));
  else L.push("", T("AI use: {0} calls, {1} tokens in, {2} tokens out, about ${3}", u.calls, u.input, u.output, cost.toFixed(4)));
  return L.join("\n");
}

function memoryLines(m, pad, n) {
  const L = [`${pad}${n ? T("MEMORY {0}", n) : T("Memory")}: ${m.name || T("(not named)")}`];
  if (m.situation) L.push(`${pad}  ${T("Situation: {0}", m.situation)}`);
  L.push(`${pad}  ${T("Starting charge: {0}", m.start ?? "-")}`);
  m.passes.forEach((p, j) => {
    L.push(`${pad}  ${T("Pass {0}", j + 1)}`);
    for (const [k, v] of Object.entries(p.perceptics)) L.push(`${pad}    ${keyLabel(k)}: ${v}`);
    if (p.story) L.push(`${pad}    ${T("What happens: {0}", p.story)}`);
    if (p.counter) L.push(`${pad}    ${T("Counter-intention: \"{0}\" (said {1}x, canceled)", p.counter, p.negCount)}`);
    if (p.seed) L.push(`${pad}    ${T("Seed: \"{0}\" (said {1}x)", p.seed, p.posCount)}`);
    if (p.after !== null) L.push(`${pad}    ${T("Charge after: {0}", p.after)}`);
  });
  return L;
}

}

        ${f.is_admin ? '<span class="small muted">Light and Deep</span>' : `
        <div class="row"><span class="small">Deep Processing: <b>${f.deep_enabled ? "on" : "off"}</b></span><span class="spacer"></span>
          <button class="small ${f.deep_enabled ? "quiet" : ""}" data-deep="${i}">${f.deep_enabled ? "Turn Deep off" : "Turn Deep on"}</button>
          <button class="small danger" data-remove="${i}">Remove</button></div>`}
      </div>`).join("");
    box.querySelectorAll("[data-deep]").forEach(b => b.onclick = async () => {
      const f = data[+b.dataset.deep];
      b.disabled = true;
      const { error } = await sb.rpc("auditor_family_set", { p_email: f.email, p_deep: !f.deep_enabled });
      ui.family(error ? "!Couldn't change that. Try again." : T(f.deep_enabled ? "Deep Processing is off for {0}." : "Deep Processing is on for {0}.", f.email));
    });
    // Two taps to remove, so one stray tap can't lock someone out.
    box.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to remove"; return; }
      const f = data[+b.dataset.remove];
      const { error } = await sb.rpc("auditor_family_remove", { p_email: f.email });
      ui.family(error ? "!Couldn't remove that person. Try again." : T("Removed {0}. Their past sessions are kept.", f.email));
    });
  },

  truth() {
    $app.innerHTML = `
      <div class="row"><h1>Absolute Truth, Understanding and Concepts</h1><span class="spacer"></span><button class="quiet small" id="back">Back</button></div>
      <div class="panel stack truth">${TRUTH.map(t => `<p>${esc(t)}</p>`).join("")}</div>`;
    document.getElementById("back").onclick = () => ui.menu();
  },

  group(g) {
    $app.innerHTML = `
      <div class="row"><h1>${esc(g.name)}</h1><span class="spacer"></span><button class="quiet small" id="back">Back</button></div>
      <p class="muted">Choose a style of processing.</p>
      <div class="stack">${MODES.filter(m => m.group === g.id).map(m => `
        <button class="mode" data-id="${m.id}" ${m.ready ? "" : "disabled"}>
          <b>${esc(m.name)}</b><span>${esc(m.desc)}</span>${m.ready ? "" : '<span class="soon">Coming later</span>'}
        </button>`).join("")}</div>`;
    document.getElementById("back").onclick = () => ui.menu();
    for (const m of MODES.filter(m => m.group === g.id && m.ready))
      $app.querySelector(`[data-id="${m.id}"]`).onclick = () => { unlockSpeech(); runSession(m); };
  },

  voices() {
    pickVoice();
    const vs = englishVoices().filter(v => !ROBOTIC.test(v.name));
    $app.innerHTML = `
      <div class="row"><h1>Voice</h1><span class="spacer"></span><button class="quiet small" id="back">Back</button></div>
      <p class="muted">Tap a voice to hear it, then tap Use this voice. Voices marked Premium or Enhanced sound the most natural.</p>
      ${IS_IOS ? '<p class="small muted">Want more choices? On iPhone go to Settings, Accessibility, Spoken Content, Voices, English, and download a Premium voice. Then come back here.</p>' : ""}
      ${IS_ANDROID ? '<p class="small muted">Want more choices? On Samsung go to Settings, General management, Text-to-speech, choose Google as the engine, and install voice data. Then come back here.</p>' : ""}
      <div class="stack list" id="vlist">${vs.length ? vs.map((v, i) => `
        <div class="row panel" style="padding:10px 12px">
          <div style="flex:1;min-width:0"><b>${esc(v.name)}</b><br><span class="small muted">${esc(v.lang)}${voice && v.name === voice.name ? ` · ${T("in use")}` : ""}</span></div>
          <button class="quiet small" data-play="${i}">Play</button><button class="small" data-use="${i}">Use</button>
        </div>`).join("") : '<p class="muted">No English voices found on this phone yet. Close and reopen the app, then try again.</p>'}
      </div>`;
    document.getElementById("back").onclick = () => ui.menu();
    $app.querySelectorAll("[data-play]").forEach(b => b.onclick = () => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(T("Where do you feel it in your body? What is the color?"));
      u.voice = vs[+b.dataset.play]; u.lang = u.voice.lang; u.rate = IS_IOS ? 0.9 : 0.95;
      speechSynthesis.speak(u);
    });
    $app.querySelectorAll("[data-use]").forEach(b => b.onclick = () => {
      try { localStorage.setItem(VOICE_KEY, vs[+b.dataset.use].name); } catch {}
      voice = vs[+b.dataset.use];
      ui.voices();
    });
  },

  changePassword(msg = "") {
    $app.innerHTML = `
      <div class="row"><h1>Change password</h1><span class="spacer"></span><button class="quiet small" id="back">Back</button></div>
      <form id="pwform" class="stack panel">
        <div class="stack"><label for="newpw">New password</label><input id="newpw" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="stack"><label for="newpw2">Type it again</label><input id="newpw2" type="password" autocomplete="new-password" minlength="6" required></div>
        <button type="submit">Save new password</button>
        <p class="small ${msg.startsWith("!") ? "err" : "muted"}">${esc(msg.replace(/^!/, ""))}</p>
      </form>`;
    document.getElementById("back").onclick = () => ui.menu();
    document.getElementById("pwform").onsubmit = async e => {
      e.preventDefault();
      const a = document.getElementById("newpw").value, b = document.getElementById("newpw2").value;
      if (a !== b) return ui.changePassword("!The two passwords don't match. Try again.");
      const { error } = await sb.auth.updateUser({ password: a });
      if (error) return ui.changePassword("!" + error.message);
      ui.changePassword("Saved. Use your new password next time you sign in.");
    };
  },

  sessionScreen() {
    $app.innerHTML = `
      <div class="row"><span class="status" id="status" data-s="speaking"><span class="dot"></span><span id="statustext">Speaking</span></span>
        <span class="spacer"></span><button class="quiet small" id="backq">Previous question</button><button class="quiet small" id="skipq">Skip</button><button class="danger small" id="stop">Stop session</button></div>
      <div class="stage">
        <p class="question" id="q" data-notr></p>
        <ol class="panel reqs" id="reqs" hidden></ol>
        <div class="counter" id="counter" hidden></div>
        <p class="heard" id="heard" data-notr></p>
      </div>
      <div class="row" id="repctl" hidden><button id="plus">+1</button><button class="quiet" id="done">Done</button></div>
      <div class="row"><button class="mic" id="mic">${MIC}</button>
        <form id="typed" class="row" style="flex:1;min-width:0;flex-wrap:nowrap"><input id="typedin" placeholder="Or type your answer" autocomplete="off" style="min-width:0"><button type="submit">Send</button></form></div>`;
    document.getElementById("stop").onclick = () => { speechSynthesis.cancel(); session?.pending?.cancel?.(); if (session && !session.pending) session.stopRequested = true; };
    // Skip: cut the speaking short, or move past the step that's waiting (not ones that need an answer).
    document.getElementById("skipq").onclick = () => {
      if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      else session?.pending?.skip?.();
    };
    document.getElementById("backq").onclick = () => {
      if (!session) return;
      speechSynthesis.cancel();
      if (session.pending?.back) session.pending.back();
      else session.backRequested = true; // taken up as soon as the next question is waiting
    };
    // The mic is a switch: tap to turn it off, tap again to turn it back on. It stays the way it was left.
    document.getElementById("mic").onclick = () => {
      micOff = !micOff;
      ui.micSwitch();
      if (micOff) session?.pending?.mute?.();
      else { srBlocked = false; session?.pending?.listen?.(); }
    };
    ui.micSwitch();
    document.getElementById("plus").onclick = () => session?.pending?.plusOne?.();
    document.getElementById("done").onclick = () => session?.pending?.done?.();
    document.getElementById("typed").onsubmit = e => {
      e.preventDefault();
      const v = document.getElementById("typedin").value; document.getElementById("typedin").value = "";
      if (session?.pending?.submit) session.pending.submit(v);
      else if (session?.pending?.plusOne) session.pending.plusOne();
    };
  },

  status(s) {
    const el = document.getElementById("status"); if (!el) return;
    el.dataset.s = s;
    document.getElementById("statustext").textContent = T({ speaking: "Speaking", listening: "Listening", thinking: "One moment", waiting: "Tap the mic or type", micoff: "Mic off. Tap the mic to turn it on, or type" }[s] || s);
    if (session?.stopRequested && s !== "speaking") { session.stopRequested = false; session.pending?.cancel?.(); }
    if (session?.backRequested && s !== "speaking" && session.pending?.back) { session.backRequested = false; session.pending.back(); }
  },
  question(t) { const el = document.getElementById("q"); if (el) { el.textContent = t; el.style.whiteSpace = "pre-line"; } ui.heard(""); },
  requirements(list) {
    const el = document.getElementById("reqs"); if (!el) return;
    el.hidden = !list;
    el.innerHTML = list ? list.map(r => `<li>${esc(r)}</li>`).join("") : "";
  },
  heard(t) { const el = document.getElementById("heard"); if (el) el.textContent = t; },
  listening(on) { const m = document.getElementById("mic"); if (m) m.classList.toggle("quiet", !on); },
  skipEnabled(on) { const b = document.getElementById("skipq"); if (b) b.disabled = !on; },
  micSwitch() {
    const m = document.getElementById("mic"); if (!m) return;
    m.innerHTML = micOff ? MIC_OFF : MIC;
    m.classList.toggle("off", micOff);
    m.setAttribute("aria-label", T(micOff ? "Microphone off. Tap to turn it on" : "Microphone on. Tap to turn it off"));
  },
  counter(n) {
    const c = document.getElementById("counter"), ctl = document.getElementById("repctl"); if (!c) return;
    c.hidden = ctl.hidden = n === null;
    if (n !== null) c.innerHTML = `${n}<small> / 10</small>`;
  },

  reportScreen(report, safety, id) {
    $app.innerHTML = `
      <h1>Session saved</h1>
      ${safety ? `<div class="panel stack"><h2>Support</h2>${T('<p>If you are in crisis or thinking about hurting yourself, reach out now. In the US, call or text <b>988</b> (Suicide &amp; Crisis Lifeline). Outside the US, contact your local emergency number.</p>')}</div>` : ""}
      <div id="notes"></div>
      <button id="back">Back to menu</button>`;
    ui.notes(document.getElementById("notes"), id, report);
    document.getElementById("back").onclick = () => ui.menu();
  },

  // Session notes with Edit and Save, since voice-to-text isn't perfect. onSaved gets the new text.
  notes(box, id, report, onSaved = () => {}) {
    const show = () => {
      box.innerHTML = `<div class="stack"><div class="panel report" data-notr>${esc(report || T("This session didn't finish, so there is no report."))}</div>
        ${id ? '<button class="quiet" id="edit">Edit notes</button>' : ""}</div>`;
      if (id) box.querySelector("#edit").onclick = edit;
    };
    const edit = () => {
      box.innerHTML = `<div class="stack"><textarea class="panel report" id="text" aria-label="${T("Session notes")}"></textarea>
        <div class="row"><button id="save">Save</button><button class="quiet" id="cancel">Cancel</button><span class="small err" id="msg"></span></div></div>`;
      const text = box.querySelector("#text");
      text.value = report || "";
      text.focus();
      box.querySelector("#cancel").onclick = show;
      box.querySelector("#save").onclick = async () => {
        box.querySelector("#save").disabled = true;
        const { error } = await sb.from("auditor_sessions").update({ report: text.value }).eq("id", id);
        if (error) {
          box.querySelector("#save").disabled = false;
          box.querySelector("#msg").textContent = "Couldn't save. Check your connection and try again.";
          return;
        }
        report = text.value;
        onSaved(report);
        show();
      };
    };
    show();
  },

  async history() {
    $app.innerHTML = `<div class="row"><h1>Past sessions</h1><span class="spacer"></span><button class="quiet small" id="back">Back</button></div><div class="stack list" id="list"><p class="muted">Loading...</p></div>`;
    document.getElementById("back").onclick = () => ui.menu();
    const { data, error } = await sb.from("auditor_sessions").select("id, mode, started_at, outcome, report").order("started_at", { ascending: false }).limit(50);
    const list = document.getElementById("list");
    if (error) { list.innerHTML = `<p class="err">Couldn't load sessions. Check your connection and try again.</p>`; return; }
    if (!data.length) { list.innerHTML = `<p class="muted">No sessions yet. Your first one will show up here.</p>`; return; }
    list.innerHTML = data.map(s => `<button data-id="${s.id}"><b>${new Date(s.started_at).toLocaleString(LOCALE, { dateStyle: "medium", timeStyle: "short" })}</b><br><span class="muted small">${esc(modeTitle(MODES.find(m => m.id === s.mode) || { name: "" }))} · ${esc(T(s.outcome || "not finished"))}</span></button>`).join("");
    list.querySelectorAll("button").forEach(b => b.onclick = () => {
      const s = data.find(x => x.id === b.dataset.id);
      if (!s) return;
      $app.innerHTML = `<div class="row"><h1>Session</h1><span class="spacer"></span><button class="quiet small" id="back2">Back</button></div>
        <div id="notes"></div>
        <div class="row"><button class="danger" id="del">Delete session</button><span class="small err" id="delmsg"></span></div>`;
      ui.notes(document.getElementById("notes"), s.id, s.report, text => { s.report = text; });
      document.getElementById("back2").onclick = () => ui.history();
      // Two taps to delete, so one stray tap can't erase a session.
      const del = document.getElementById("del");
      del.onclick = async () => {
        if (!del.dataset.armed) { del.dataset.armed = "1"; del.textContent = "Tap again to delete for good"; return; }
        del.disabled = true;
        const { error } = await sb.from("auditor_sessions").delete().eq("id", s.id);
        if (error) { del.disabled = false; document.getElementById("delmsg").textContent = "Couldn't delete. Check your connection and try again."; return; }
        ui.history();
      };
    });
  },
};

sb.auth.getSession().then(({ data }) => data.session ? ui.menu() : ui.signIn());

// Phones keep a saved copy of the app. Check for a newer published version on open and whenever
// the app comes back on screen, and reload into it, but never in the middle of a session.
async function checkForUpdate() {
  if (APP_VERSION === "dev" || session) return;
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const live = (await res.text()).match(/APP_VERSION = "([^"]+)"/);
    if (live && live[1] !== APP_VERSION && !session) location.replace(location.pathname + "?v=" + live[1]);
  } catch {}
}
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
</script>
</body>
</html>
